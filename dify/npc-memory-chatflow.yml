app:
  description: 会把你过去的恶作剧一条条记下来的酒馆掌柜 NPC。seekdb 负责记忆与世界设定，Dify 负责编排与台词生成。
  icon: 🦞
  icon_background: '#E4FBCC'
  mode: advanced-chat
  name: 记得你所有恶作剧的掌柜
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 500
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 100
        video_file_size_limit: 500
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 我是这家酒馆的掌柜。你之前干过什么，我全都记着。说吧，这次又做了什么？
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 我上次藏了什么东西？
    - 这家店有什么规矩？
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: code
      id: start-source-encode-ctx-target
      source: start
      sourceHandle: source
      target: encode_ctx
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: code
        targetType: http-request
      id: encode-ctx-source-ctx-target
      source: encode_ctx
      sourceHandle: source
      target: ctx
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: llm
      id: ctx-source-llm-target
      source: ctx
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: code
      id: llm-source-encode-mem-target
      source: llm
      sourceHandle: source
      target: encode_mem
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: code
        targetType: http-request
      id: encode-mem-source-mem-target
      source: encode_mem
      sourceHandle: source
      target: mem
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: answer
      id: mem-source-answer-target
      source: mem
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 玩家标识与这一轮说的话
        selected: false
        title: 开始
        type: start
        variables:
        - label: 玩家标识
          max_length: 64
          options: []
          required: true
          type: text-input
          variable: session_id
        - label: 玩家这次说了什么
          max_length: 2000
          options: []
          required: true
          type: paragraph
          variable: player_input
      height: 122
      id: start
      position:
        x: 80
        y: 280
      positionAbsolute:
        x: 80
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          import json

          def main(session_id: str, player_input: str) -> dict:
              return {"payload": json.dumps({
                  "session_id": session_id,
                  "query": player_input,
              }, ensure_ascii=False)}
        code_language: python3
        desc: 把玩家输入序列化为合法 JSON，保留引号、换行和反斜杠
        outputs:
          payload:
            children: null
            type: string
        selected: false
        title: 编码查询请求
        type: code
        variables:
        - value_selector: [start, session_id]
          variable: session_id
        - value_selector: [start, player_input]
          variable: player_input
      height: 54
      id: encode_ctx
      position: {x: 380, y: 280}
      positionAbsolute: {x: 380, y: 280}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: body-json
            key: ''
            type: text
            value: '{{#encode_ctx.payload#}}'
          type: raw-text
        default_value:
        - key: body
          type: string
          value: '{"session_id": "", "query": "", "memory": [], "lore": []}'
        - key: status_code
          type: number
          value: 0
        - key: headers
          type: object
          value: '{}'
        desc: 向记忆服务取回这个玩家的过往记忆，并用全文索引检索相关设定
        error_strategy: default-value
        headers: 'Content-Type:application/json'
        method: post
        params: ''
        retry_config:
          max_retries: 3
          retry_enabled: true
          retry_interval: 100
        selected: false
        ssl_verify: true
        timeout:
          max_connect_timeout: 30
          max_read_timeout: 60
          max_write_timeout: 30
        title: 读取记忆与设定
        type: http-request
        url: 'http://127.0.0.1:8808/context'
        variables: []
      height: 136
      id: ctx
      position:
        x: 680
        y: 280
      positionAbsolute:
        x: 680
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        default_value:
        - key: text
          type: string
          value: '（掌柜一时没接上话，账本先空着。你再说一遍？）'
        desc: 结合记忆与设定生成掌柜的回应
        error_strategy: default-value
        model:
          completion_params:
            temperature: 0.8
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        prompt_template:
        - id: sys-1
          role: system
          text: |
            你是「歪脖子酒馆」的掌柜，一个记得住每一个客人恶作剧的老狐狸。

            规则：
            1. 资料里有 `memory`（这个玩家过去的对话记录）和 `lore`（用全文索引从世界设定表里检索出来的条目）。
               有资料时，只依据资料说话，不要编造资料里没有的设定。
            2. 每条 `lore` 同时带中英两版：`title` / `body` 是英文原文，`title_zh` / `body_zh` 是同一条设定的中文版本。
               用**中文**回答玩家，引用设定时用 `title_zh` / `body_zh` 的说法，并改写成酒馆的口吻（不要直接念英文原文）。
            3. 如果玩家的行为违反了 `lore` 里的规矩，用掌柜的口吻点破它，并引用对应的设定条目。
            4. 如果玩家重复了以前干过的事，明确指出账本上已经记着，不许重复。
            5. 资料为空（记忆服务暂时联系不上）时，不要提「读不到资料」，直接按掌柜的性格和这一轮玩家说的话回应。
            6. 每次回话控制在 120 字以内，语气要有市井气，可以有点促狭，但不要脏话。
            7. 最后用一行 `账本:` 开头记录这一轮玩家的行为摘要。
        - id: usr-1
          role: user
          text: |
            玩家这次说了：{{#start.player_input#}}

            记忆服务返回的资料：
            {{#ctx.body#}}
        retry_config:
          max_retries: 3
          retry_enabled: true
          retry_interval: 1000
        selected: false
        title: 掌柜
        type: llm
        variables: []
      height: 96
      id: llm
      position:
        x: 980
        y: 280
      positionAbsolute:
        x: 980
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          import json

          def main(session_id: str, player_input: str, npc_reply: str) -> dict:
              return {"payload": json.dumps({
                  "session_id": session_id,
                  "player_input": player_input,
                  "npc_reply": npc_reply,
              }, ensure_ascii=False)}
        code_language: python3
        desc: 把多行回复序列化为合法 JSON，再写回记忆
        outputs:
          payload:
            children: null
            type: string
        selected: false
        title: 编码记忆请求
        type: code
        variables:
        - value_selector: [start, session_id]
          variable: session_id
        - value_selector: [start, player_input]
          variable: player_input
        - value_selector: [llm, text]
          variable: npc_reply
      height: 54
      id: encode_mem
      position: {x: 1280, y: 280}
      positionAbsolute: {x: 1280, y: 280}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: body-json
            key: ''
            type: text
            value: '{{#encode_mem.payload#}}'
          type: raw-text
        default_value:
        - key: body
          type: string
          value: '{"ok": false, "skipped": true}'
        - key: status_code
          type: number
          value: 0
        - key: headers
          type: object
          value: '{}'
        desc: 把这一轮写回 seekdb 的记忆表
        error_strategy: default-value
        headers: 'Content-Type:application/json'
        method: post
        params: ''
        retry_config:
          max_retries: 3
          retry_enabled: true
          retry_interval: 100
        selected: false
        ssl_verify: true
        timeout:
          max_connect_timeout: 30
          max_read_timeout: 60
          max_write_timeout: 30
        title: 写回记忆
        type: http-request
        url: 'http://127.0.0.1:8808/memory'
        variables: []
      height: 136
      id: mem
      position:
        x: 1580
        y: 280
      positionAbsolute:
        x: 1580
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#llm.text#}}'
        desc: ''
        selected: false
        title: 回答
        type: answer
        variables: []
      height: 105
      id: answer
      position:
        x: 1880
        y: 280
      positionAbsolute:
        x: 1880
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.75
